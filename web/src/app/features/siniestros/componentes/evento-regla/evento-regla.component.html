@let t = textos.t();
<section class="card" [attr.aria-labelledby]="idTitulo">
  <h3 [id]="idTitulo">{{ t.eventoTitulo }}</h3>
  <p class="sub">{{ t.eventoDescripcion }}</p>
  <dl class="filas">
    @for (fila of filas(); track fila.etiqueta) {
      <div>
        <dt>{{ fila.etiqueta }}</dt>
        <dd>{{ fila.valor }}</dd>
      </div>
    }
  </dl>
  <p class="nota">{{ t.eventoAviso }}</p>
</section>
