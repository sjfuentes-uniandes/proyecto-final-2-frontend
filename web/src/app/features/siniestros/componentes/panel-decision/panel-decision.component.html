@let t = textos.t();
<section class="panel" [attr.aria-labelledby]="idTitulo">
  <h3 class="sr-only" [id]="idTitulo">{{ t.panelDecision }}</h3>
  @if (hayErrores()) {
    <p class="alerta alerta--error" role="alert"><span aria-hidden="true">⚠</span><span>{{ t.liqRevisar }}</span></p>
  }
  <button class="btn btn--bloque btn--aprobar" type="button" (click)="aprobar()">{{ t.accionAprobar }}</button>
  <!-- Solicitar soporte y rechazar son las páginas H05 y H07 (W20-F05 y F06). -->
  <button class="btn btn--bloque btn--secundario" type="button" disabled [attr.title]="t.proximamente">{{ t.accionSolicitarSoporte }}</button>
  <button class="btn btn--bloque btn--rechazar" type="button" disabled [attr.title]="t.proximamente">{{ t.accionRechazar }}</button>
  <p class="nota">{{ t.avisoPagoUnico }}</p>
</section>
<app-confirmar-aprobacion
  [siniestro]="detalle()"
  [solicitud]="solicitud()"
  (cerrado)="cerrarConfirmacion()"
  (aprobada)="alAprobar($event)"
  (conflicto)="alConflicto($event)"
/>
