<header class="topbar">
  <a class="logo" routerLink="/" aria-label="Solventa, inicio"><span class="logo__marca">S</span>Solventa</a>
  @if (sesion.autenticado()) {
    <nav class="nav" aria-label="Principal">
      @for (item of menu(); track item.etiqueta) {
        @if (item.ruta) {
          <a [routerLink]="item.ruta" routerLinkActive="nav__item--activo" class="nav__item">{{ item.etiqueta }}</a>
        } @else {
          <span class="nav__item nav__item--off" title="Próximamente">{{ item.etiqueta }}</span>
        }
      }
    </nav>
  }
  <div class="topright">
    <select class="lang" aria-label="Idioma / Language" (change)="cambiarIdioma($event)">
      @for (opcion of idiomas; track opcion) {
        <option [value]="opcion" [selected]="opcion === idioma.actual()">{{ opcion }}</option>
      }
    </select>
    @if (sesion.autenticado()) {
      <span class="usuario">{{ sesion.nombre() }}{{ rol() }}</span>
      <span class="avatar" aria-hidden="true">{{ sesion.iniciales() }}</span>
      <button class="salir" type="button" (click)="salir()">Salir</button>
    } @else {
      <span>Portal de gestión</span>
    }
  </div>
</header>
<div class="main">
  <router-outlet />
</div>
