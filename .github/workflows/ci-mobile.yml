name: CI mobile
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/ci-mobile.yml"]

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Caché de Gradle y validación del wrapper. El runner ya trae el SDK de Android (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
      # gradlew está en git sin el bit de ejecución.
      - run: chmod +x gradlew
      # Unitarias de todos los módulos (debug y release), incluidas las de Robolectric.
      - run: ./gradlew test --console=plain
      # Lint de todos los módulos: MissingTranslation y HardcodedText son error (build-logic/convention).
      - run: ./gradlew lint --console=plain
      # Compuerta de cobertura de :feature:privacidad: ≥ 80 % líneas / ≥ 75 % ramas (Kover).
      - run: ./gradlew :feature:privacidad:koverVerify --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-mobile
          path: |
            mobile/**/build/reports/
            mobile/**/build/test-results/
          if-no-files-found: ignore
