@let t = textos.t();
<section class="card" [attr.aria-labelledby]="idTitulo">
  <h3 [id]="idTitulo">{{ t.tituloVerificacion }}</h3>
  <table class="data" [attr.aria-labelledby]="idTitulo">
    <thead>
      <tr>
        <th scope="col">{{ t.colVerificacion }}</th>
        <th scope="col">{{ t.colResultado }}</th>
        <th scope="col">{{ t.colEstadoVerificacion }}</th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.codigo) {
        <tr>
          <th scope="row" class="etiqueta">{{ fila.etiqueta }}</th>
          <td>{{ fila.resultado }}</td>
          <td><app-insignia-estado [insignia]="fila.insignia" /></td>
        </tr>
      }
    </tbody>
  </table>
</section>
