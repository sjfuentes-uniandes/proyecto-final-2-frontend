@let t = textos.t();
<section class="card" [attr.aria-labelledby]="idTitulo">
  <h3 [id]="idTitulo">
    {{ t.siguientePasoTitulo }}
    @if (insignia(); as i) {
      <span [class]="i.clase">{{ i.texto }}</span>
    }
  </h3>
  <p class="mensaje">{{ mensaje() }}</p>
  @if (comunicacion().plazoRespuestaHoras; as horas) {
    <dl class="kv">
      <div><dt>{{ t.plazoRespuesta }}</dt><dd>{{ t.hastaHoras(horas) }}</dd></div>
    </dl>
  }
  @if (cotizarDeNuevo()) {
    <a class="btn btn--secundario btn--bloque" routerLink="/perfilamiento/nuevo">{{ t.cotizarNuevamente }}</a>
  }
</section>
