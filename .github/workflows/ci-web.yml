name: CI web
on:
  pull_request:
    paths: ["web/**"]

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Pruebas con cobertura y compuerta 80/75 de la feature de perfilamiento (CS-13, CS-15).
      - run: npm run test:ci
      - run: npx ng build
