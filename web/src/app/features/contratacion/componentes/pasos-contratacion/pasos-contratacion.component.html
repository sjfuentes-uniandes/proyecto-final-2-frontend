<ol class="pasos" [attr.aria-label]="textos.t().pasosContratacion">
  @for (paso of pasos(); track paso.numero) {
    <li
      [class.hecho]="paso.hecho"
      [class.actual]="paso.actual"
      [class.no-disponible]="paso.noDisponible"
      [attr.aria-current]="paso.actual ? 'step' : null"
    >
      {{ paso.numero }} · {{ paso.texto }}
      @if (paso.noDisponible) {
        ({{ textos.t().noDisponible }})
      }
    </li>
  }
</ol>
